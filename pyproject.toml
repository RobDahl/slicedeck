[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slicedeck"
version = "1.0.0"
description = "Split one live camera frame across the keys of a Stream Deck."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["streamdeck", "camera", "reolink", "mjpeg", "image-processing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "pillow>=10.0",
    "requests>=2.31",
    "numpy>=1.24",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
hid = ["streamdeck>=0.9"]
video = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
slicedeck = "slicedeck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter
    # Sinks and sources deliberately give frame_start/frame_end/close a no-op
    # default: they are optional lifecycle hooks, not required overrides.
    "B027",
]
